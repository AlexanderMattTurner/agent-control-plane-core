name: Claude reviewers

# The automated PR reviewers, as CALLS into the repository that owns them:
# AlexanderMattTurner/agent-review. That repository holds the reviewer itself —
# the skip routing, the read budget, the per-file shard fan-out, the input
# sanitizer, the credential ladder and the posting path. Its scripts run from the
# commit the `uses:` lines below pin, so a pull request here cannot rewrite the
# code that reviews it.
#
# Two things stay HERE: the review prompt (.github/prompts/claude-pr-review.md)
# and the merge-delta reviewer, which agent-review publishes no reusable version
# of.
#
# The merge lever changed with this move. The old vendored reviewer posted a
# REQUEST_CHANGES review that held the merge, and three mechanisms existed only
# to lift it again — a Haiku thread resolver, a push-time approver and an hourly
# sweep. agent-review's reviewer posts a COMMENT and holds nothing; the lever is
# the "Automated review posted" commit status that review-gate.yaml evaluates
# from the review's own unresolved threads. A status is recomputed per head, so
# it cannot strand a verdict on a commit two pushes old.
#
# The merge-conflict auto-resolver stays a SEPARATE file
# (auto-resolve-conflicts.yaml): it checks out the PR HEAD to merge into it, and
# co-locating a head checkout with pull_request_target trips CodeQL's
# untrusted-checkout query (file-scoped, blind to per-job event gating) and would
# blind that query to these secrets-bearing reviewer jobs.

on: # zizmor: ignore[dangerous-triggers] — reviewer jobs are base-only checkout + least privilege; see each job's header
  # `opened`/`ready_for_review`/`synchronize` drive the first-pass reviewer and
  # the merge-delta reviewer; `labeled` is the reviewer's on-demand escape hatch
  # (the `needs-auto-review` label). Each job's `if:` re-scopes it to its own
  # events. Because pull_request_target always runs the workflow file from the
  # base branch, these reviewers only take effect once merged to the default
  # branch.
  pull_request_target: # not-required-check
    types: [opened, ready_for_review, synchronize, labeled]

permissions: {}

jobs:
  # Routes a pull request into "the reviewer reads it" or "the reviewer skips it,
  # so post the stand-in approval a review-required ruleset would otherwise
  # strand". `review` below negates this job's `skip` output, so the two are
  # exact complements: every pull request is reviewed or approved, never neither
  # and never both.
  classify:
    name: Reviewer skip routing
    # not-required-check: routes a pull request and reports no verdict of its own.
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    uses: AlexanderMattTurner/agent-review/.github/workflows/review-skipped-approval.yaml@6791f8174011f569ad9bd8dfb15b139f21a96c09 # pin-comment-ok: agent-review cuts no release yet; re-pin at its first vX.Y
    with:
      reviewer-repository: AlexanderMattTurner/agent-review
      # Keep in lockstep with the `uses:` sha above. Left empty, the called
      # workflow reads it back out of `github.job_workflow_sha`, which resolves
      # to the empty string in the expression context, and every job then dies on
      # its own `reviewer-ref is empty` refusal.
      reviewer-ref: 6791f8174011f569ad9bd8dfb15b139f21a96c09
      # BYTE-IDENTICAL to `gate_context` in config/review-severities.json and to
      # the job name in review-gate-context.yaml. YAML cannot read a file, so
      # these are the restatements the design cannot remove; renaming one alone
      # leaves every pull request waiting on a context nothing reports.
      status-context: Automated review posted
      # `failure`, not `pending`: a pending status does not appear in
      # `gh pr checks` at all, so a reader cannot tell "the reviewer has not
      # spoken yet" from "no gate here". Both block the required context.
      unreviewed-state: failure

  # The first-pass reviewer: `max-reviews-per-pr` whole-diff reads per pull
  # request, sharded across parallel passes and posted as one review.
  #
  # SECURITY — the reviewer's own header states the posture in full: a base-only
  # checkout of THIS repository's default branch, the pull request's changes read
  # only as sanitized DATA, and least privilege per job. The `permissions:` block
  # below is the CEILING those jobs are narrowed from, never a grant — GitHub
  # lets a called workflow request only what the calling job holds, so a caller
  # that grants less ends the run in `startup_failure` before any job starts.
  review:
    # Reads `classify`, so this is the exact complement of the approval that job
    # posts. `labeled` is the on-demand hatch: it starts the read the stand-in
    # approval offers, whatever the class says.
    needs: classify
    if: >-
      github.event.action == 'labeled' ||
      (
        contains(fromJSON('["opened","ready_for_review","synchronize"]'), github.event.action) &&
        needs.classify.outputs.skip != 'true'
      )
    permissions:
      contents: read # the reviewer checks out this repository's default branch
      pull-requests: write # post the review
      statuses: write # the post-review command re-posts this head's verdict
      actions: read # the owed-review re-check lists this workflow's in-flight runs
      checks: read # the gate re-post reads the merge-delta reviewer's check run
    uses: AlexanderMattTurner/agent-review/.github/workflows/review.yaml@6791f8174011f569ad9bd8dfb15b139f21a96c09 # pin-comment-ok: agent-review cuts no release yet; re-pin at its first vX.Y
    with:
      reviewer-repository: AlexanderMattTurner/agent-review
      reviewer-ref: 6791f8174011f569ad9bd8dfb15b139f21a96c09
      # The model the vendored reviewer already used. Explicit so an upstream
      # default change cannot silently re-price and re-score every review here.
      model: claude-opus-4-8
      review-prompt: .github/prompts/claude-pr-review.md
      # Re-post the gate verdict once the review and its finding threads exist.
      # Nothing else would: the review posts with the workflow GITHUB_TOKEN,
      # whose events start no workflow run, so review-gate.yaml never hears about
      # it and the head would keep its pre-review red until the next push.
      # `${REVIEWER_DIR}` is the reviewer's own clone, which the called workflow
      # exports; `${PWD}` is this repository's checkout, where the severity SSOT
      # is.
      post-review-command: |
        SEVERITY_CONFIG="${PWD}/config/review-severities.json" \
          UNREVIEWED_STATE=failure \
          bash "${REVIEWER_DIR}/review-findings-gate.sh"
    secrets:
      # Rung 1 is a metered API key, spent before any subscription token. This
      # repository has none, and an empty rung is not a stop — the ladder drops
      # it and reaches the rungs behind.
      rung_1: ${{ secrets.FAR_ANTHROPIC_API_KEY }}
      rung_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK }}
      rung_3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_2 }}
      rung_4: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_3 }}
      rung_5: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_4 }}
      rung_6: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_5 }}
      rung_7: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_6 }}
      rung_8: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # ────────────────────────────────────────────────────────────────────────────
  # Claude merge-delta review (Sonnet) — formerly its own workflow file
  #
  # A dedicated Sonnet reviewer for a PR's hand-authored MERGE-RESOLUTION deltas
  # (`git show --remerge-diff`) — the one channel through which a conflict
  # resolution can introduce content present in neither parent (an "evil merge")
  # that the ordinary PR diff never isolates. Separate from the first-pass
  # reviewer (the review job) and the thread-resolver: those read the net
  # diff and so share the blind spot this closes.
  #
  # SECURITY — same posture as the review job (see its header): a fork PR on
  # plain `pull_request` gets no secrets, so `pull_request_target` runs in the
  # trusted BASE context. To stay safe this workflow:
  #   1. checks out the BASE branch, never the untrusted PR head — no fork-authored
  #      code is checked out or executed;
  #   2. brings the PR head's commits in only as git OBJECTS (prepare-merge-delta-
  #      input.sh fetches refs/pull/N/head with per-command auth and never checks it
  #      out), renders the remerge-diff with the trusted base-checkout renderer, and
  #      sanitizes it before the model sees it — treated as untrusted DATA;
  #   3. holds least privilege — contents:read + pull-requests:write only, so even a
  #      successful injection can post a PR comment but cannot push, merge, or reach
  #      any other scope; the reviewer only ANALYZES and the post step is advisory.
  # Because pull_request_target always runs the workflow from the base branch, this
  # reviewer only takes effect once merged to the default branch.
  # ────────────────────────────────────────────────────────────────────────────
  merge_delta_review:
    name: Review the PR's merge-resolution deltas
    # Skip drafts (can't merge) and bot-authored PRs (never Claude-reviewed). The
    # action guard keeps it off the union's `labeled` escape hatch — the source
    # workflow fired only on opened/ready_for_review/synchronize.
    if: >-
      contains(fromJSON('["opened","ready_for_review","synchronize"]'), github.event.action) &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One review per PR at a time; a newer push supersedes an in-flight run (latest
    # head wins). Keyed by PR number, so it never strands a required check.
    concurrency:
      group: claude-merge-delta-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read # checkout the trusted base commit
      pull-requests: write # post the advisory comment
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout base (trusted) branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Default branch (trusted repo content), never the untrusted PR head
          # and never the author-writable base.ref — same rationale as the
          # review job. fetch-depth: 0 so the merge-base of the PR head
          # (fetched as objects) resolves.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0

      - name: Install the input sanitizer
        # Self-contained install (into .github/scripts/node_modules) so repos
        # synced from the template need no sanitizer entry in their own
        # package.json. --ignore-scripts keeps the install hermetic.
        run: bash .github/scripts/install-input-sanitizer.sh

      - name: Render and sanitize the merge-resolution deltas
        id: prepare
        env:
          PR_INPUT_DIR: ${{ runner.temp }}/pr-input
        run: bash .github/scripts/prepare-merge-delta-input.sh

      - name: Review the merge deltas with Claude (Sonnet)
        if: steps.prepare.outputs.has_deltas == 'true'
        uses: ./.github/actions/claude-run
        with:
          oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          fallback_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK }}
          fallback_oauth_token_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_2 }}
          fallback_oauth_token_3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_3 }}
          fallback_oauth_token_4: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_4 }}
          fallback_oauth_token_5: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_5 }}
          fallback_oauth_token_6: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_6 }}
          # Give the action the workflow token directly. Without it, the action
          # tries to mint one via an OIDC→GitHub-App token exchange that isn't
          # authorized here and fails with "401 Invalid OIDC token" before Claude
          # runs.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Review outside-contributor PRs too; safe for the same reasons as the
          # first-pass reviewer (base-only checkout, least-privilege token,
          # sanitized data-only input).
          allowed_non_write_users: "*"
          model: claude-sonnet-5
          claude_args: >-
            --setting-sources user
            --allowedTools "Read(./**),Read(//${{ runner.temp }}/pr-input/**),Edit(//${{ runner.temp }}/pr-input/**)"
            --add-dir "${{ runner.temp }}/pr-input"
          prompt: |
            You are the merge-delta reviewer for PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Follow the instructions in .github/prompts/claude-merge-delta-review.md — it is the
            single source of truth for how to review and the exact merge-review.md format.

            Write your review to ${{ runner.temp }}/pr-input/merge-review.md — nothing else.
            Do not post comments, resolve threads, push commits, edit the PR, or merge.
          # claude-run prepends the canonical untrusted-data guard for these.
          untrusted_files: |
            merge deltas: ${{ runner.temp }}/pr-input/merge-delta.txt

      - name: Post the advisory merge-delta review
        # Runs whenever prepare SUCCEEDED — including has_deltas=false — so a
        # sticky comment about a since-removed merge is refreshed to the clean
        # verdict rather than left stale. Skipped when prepare failed loud (an
        # octopus / renderer error), where the red job IS the signal.
        if: steps.prepare.conclusion == 'success'
        env:
          PR_INPUT_DIR: ${{ runner.temp }}/pr-input
        run: bash .github/scripts/post-merge-delta-review.sh
