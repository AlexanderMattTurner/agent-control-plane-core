# Run with: `pre-commit run --all-files` (or install with `pre-commit install`).
# CI runs this via `.github/workflows/pre-commit.yaml` regardless of whether
# contributors have pre-commit installed locally. The existing `.hooks/pre-commit`
# handles staged-file formatting via lint-staged on every commit; this config
# adds wider hygiene checks (shellcheck, large-file detection, JSON/YAML
# validity, etc.) that aren't covered there.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^pnpm-lock\.yaml$
      - id: end-of-file-fixer
        exclude: ^pnpm-lock\.yaml$
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-case-conflict
      - id: check-symlinks
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        # Enable one optional check beyond the defaults: require [[ ]] over
        # [ ] in bash/ksh.
        args: [-x, -P, .claude/hooks, -o, require-double-brackets]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.12.0-2
    hooks:
      - id: shfmt
        args: [-i, "2", -w]

  # Lints workflow/action correctness and runs shellcheck on inline `run:`
  # blocks that the standalone shellcheck hook can't see. Python-wrapped so it
  # needs no Go toolchain in the Python-only pre-commit CI job.
  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.24
    hooks:
      - id: actionlint

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Honesty + identity CI lints: catch a green check that hides a failed
  # command (pipefail/|| true/2>/dev/null), a path-filtered required check that
  # hangs forever, or a mutable base-image/download pin. Tier 2 adds the
  # required-check-shape lints this template's workflows already follow
  # (classified always() reporters, explicit concurrency, externalized run
  # blocks). Extras adds the off-theme checks: check-claude-model (explicit
  # --model on the claude-code-action steps this template ships), the Python
  # lints (unnamed-regex-group, global-stdio-swap), and the prose lints that
  # reject a hand-wave or a rotting file:line citation in docs and comments.
  # Tier aggregates over per-check ids so a check added upstream to a tier
  # applies here with no config change — which is also why advancing `rev` can
  # surface new findings in code this repo has not touched.
  - repo: https://github.com/AlexanderMattTurner/ci-truth-serum
    # ci-truth-serum main, past AlexanderMattTurner/ci-truth-serum#169.
    rev: 01aa20655323f8ce5a5b8554556dd9dbeeedc232
    hooks:
      - id: check-tier1
      - id: check-tier2
      - id: check-extras
        # These four functions are vendored shared-library API surface (git_authed
        # in git-auth.bash; claude_oauth_ladder, auto_resolve_mark_attempt and
        # auto_resolve_release_attempt, kept in lockstep with the same-named
        # files in AlexanderMattTurner/agent-resolve-merge-conflicts) that this
        # repo's own workflows do not currently call — auto-resolve-conflicts.yaml
        # clones and runs that repo's code fresh instead of sourcing the local
        # copy. Not dead in the sense the check exists to catch.
        args:
          - --check-arg
          - check_dead_shell_functions=--always-live=git_authed
          - --check-arg
          - check_dead_shell_functions=--always-live=claude_oauth_ladder
          - --check-arg
          - check_dead_shell_functions=--always-live=auto_resolve_mark_attempt
          - --check-arg
          - check_dead_shell_functions=--always-live=auto_resolve_release_attempt
      # The one pack member outside the aggregates (language: script, so the
      # Python tier runner can't host it): reject absolute-target symlinks.
      # Renamed from check-symlinks upstream (4ac5d45) to avoid colliding
      # with pre-commit-hooks' own check-symlinks id.
      - id: check-absolute-symlinks
        name: "extra: reject tracked symlinks with absolute targets"

  - repo: local
    hooks:
      - id: zizmor
        name: zizmor (GitHub Actions security audit)
        entry: zizmor
        language: python
        additional_dependencies: ["zizmor==1.25.2"]
        pass_filenames: false
        # --offline: the `known-vulnerable-actions` audit queries
        # api.github.com/advisories, which a sandboxed or repo-scoped session
        # cannot reach — and zizmor aborts the WHOLE run on that error ("fatal:
        # no audit was performed"), so one unreachable endpoint takes every
        # other audit down with it and blocks the commit. Offline keeps the
        # local run useful. The advisory audit still runs, with network, in
        # .github/workflows/zizmor.yaml — a required check, so it is not lost.
        args: ["--offline", ".github/"]
        files: ^\.github/

      - id: validate-config
        name: validate Claude hook configuration
        entry: bash .github/scripts/validate-config.sh
        language: system
        pass_filenames: false
        files: ^(\.claude/|\.hooks/|\.github/workflows/)

      - id: lint-skills
        name: lint Claude SKILL.md files
        entry: bash .hooks/lint-skills.sh
        language: system
        files: ^\.claude/skills/.*\.md$
